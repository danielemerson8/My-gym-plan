<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon.svg'><title>My Gym Plan</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f17;color:#f8fafc;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{position:sticky;top:0;background:#0b0f17ee;backdrop-filter:blur(12px);padding:12px 0 10px;z-index:2}h1{font-size:25px;margin:0}small,.muted{color:#94a3b8}.days{display:flex;gap:8px;overflow:auto;padding:10px 0}.day{border:0;border-radius:12px;padding:10px 13px;background:#1e293b;color:#fff;white-space:nowrap;font-weight:700}.day.active{background:#fff;color:#111827}.card{background:#151c29;border:1px solid #273244;border-radius:16px;padding:14px;margin:10px 0}.card h3{margin:0 0 4px;font-size:17px}.meta{display:flex;gap:10px;color:#cbd5e1;font-size:13px;margin-bottom:10px}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:7px;align-items:center}.set span{font-weight:700;text-align:center}.set input{width:100%;border:1px solid #334155;background:#0f172a;color:#fff;border-radius:9px;padding:10px;font-size:16px}.set button{height:40px;border:0;border-radius:10px;background:#334155;color:#fff;font-size:18px}.set button.done{background:#22c55e;color:#052e16}.last{font-size:12px;color:#94a3b8;margin-top:8px}.timer{display:flex;gap:8px;align-items:center;margin:12px 0}.timer button,.save{border:0;border-radius:11px;padding:11px 13px;font-weight:700}.timer button{background:#1e293b;color:#fff}.save{background:#f8fafc;color:#0f172a;width:100%;font-size:16px}.recovery{font-size:18px;line-height:1.5}.tip{background:#172033;border-radius:12px;padding:10px;font-size:13px;color:#cbd5e1;margin:8px 0 14px}footer{text-align:center;color:#64748b;font-size:12px;padding:24px 0}</style></head><body><header><h1>My Gym Plan</h1><small>5 lifting days • 2 active recovery days</small><div class='days' id='days'></div></header><main id='main'></main><footer>Progress is saved on this device.</footer><script>
const plan=[
['Day 1','Chest + Triceps + Treadmill',[['Flat DB Bench Press',4,'6–8'],['Incline DB Press',4,'8–10'],['DB Chest Fly',3,'10–12'],['DB Pullover',3,'10–12'],['DB Overhead Triceps Extension',3,'8–12'],['DB Skull Crushers',3,'10–12'],['Rope Triceps Pushdown',3,'10–15'],['Incline Treadmill',1,'25–30 min']]],
['Day 2','Back + Biceps + Core',[['One-Arm DB Row',4,'6–8 / arm'],['Chest-Supported DB Row',3,'8–10'],['Lat Pulldown',4,'8–10'],['Seated Cable Row',3,'8–12'],['Alternating DB Curl',3,'8–10'],['Hammer Curl',3,'10–12'],['Incline DB Curl',2,'10–12'],['Cable Crunch',3,'12–15'],['Plank',3,'45–60 sec']]],
['Day 3','Active Recovery',[['Incline Treadmill',1,'35–45 min'],['Cable Woodchop',3,'12 / side'],['Pallof Press',3,'12 / side'],['Plank',3,'45–60 sec']]],
['Day 4','Heavy Legs + Shoulders',[['Plate-Loaded Hack Squat',4,'6–8'],['Plate-Loaded Leg Press',4,'8–10'],['Leg Curl Machine',4,'8–12'],['Leg Extension Machine',3,'10–15'],['Hip Abductor Machine',3,'12–15'],['Hip Adductor Machine',3,'12–15'],['Leg-Press Calf Raises',4,'12–15'],['Seated DB Shoulder Press',4,'6–8'],['DB Lateral Raise',3,'10–15'],['Chest-Supported DB Reverse Fly',3,'12–15']]],
['Day 5','Chest + Back + Arms',[['Incline DB Press',3,'8–10'],['Flat DB Press',3,'10–12'],['Chest-Supported DB Row',3,'8–10'],['Lat Pulldown',3,'8–12'],['DB Curl',3,'8–12'],['Hammer Curl',2,'10–12'],['DB Overhead Triceps Extension',3,'8–12'],['Rope Triceps Pushdown',2,'10–15'],['DB Lateral Raise',3,'12–15'],['Optional Stairs',1,'15–20 min']]],
['Day 6','Legs + Shoulders + Golf Core',[['Plate-Loaded Leg Press',4,'10–12'],['Hack Squat',3,'10–12'],['Leg Curl',4,'10–12'],['Leg Extension',3,'12–15'],['Hip Abductor',3,'12–15'],['Calf Raises',4,'12–15'],['DB Shoulder Press',3,'8–10'],['DB Lateral Raise',3,'12–15'],['DB Reverse Fly',3,'12–15'],['Cable Woodchop',3,'10–12 / side'],['Pallof Press',3,'10–12 / side']]],
['Day 7','Active Recovery',[['Incline Treadmill',1,'30–45 min'],['Mobility / Stretching',1,'10–15 min']]]];
let current=0; const $=s=>document.querySelector(s); const key=(d,e,s)=>`gym-${d}-${e}-${s}`;
function renderDays(){ $('#days').innerHTML=plan.map((d,i)=>`<button class='day ${i===current?'active':''}' onclick='current=${i};render()'>${d[0]}</button>`).join('') }
function render(){renderDays();let [day,title,ex]=plan[current]; $('#main').innerHTML=`<h2>${day}: ${title}</h2><div class='tip'>Heavy compound lifts: rest 2–3 min. Smaller exercises: 60–90 sec. When you reach the top of the rep range on every set with good form, increase weight next time.</div>`+ex.map((x,ei)=>card(x,ei)).join('')+`<button class='save' onclick='saveAll()'>Save workout</button><div class='timer'><b>Rest timer:</b><button onclick='timer(60)'>60s</button><button onclick='timer(90)'>90s</button><button onclick='timer(180)'>3m</button><span id='clock'></span></div>`; loadAll() }
function card(x,ei){let [name,sets,target]=x;let rows='';for(let s=0;s<sets;s++)rows+=`<div class='set'><span>${s+1}</span><input inputmode='decimal' placeholder='Weight' data-k='${key(current,ei,s)}-w'><input inputmode='numeric' placeholder='Reps' data-k='${key(current,ei,s)}-r'><button onclick='this.classList.toggle("done")'>✓</button></div>`;return `<section class='card'><h3>${name}</h3><div class='meta'><span>${sets} set${sets>1?'s':''}</span><span>Target: ${target}</span></div><div class='sets'>${rows}</div><div class='last' id='last-${ei}'></div></section>`}
function saveAll(){document.querySelectorAll('input[data-k]').forEach(i=>localStorage.setItem(i.dataset.k,i.value)); localStorage.setItem(`gym-last-${current}`,new Date().toLocaleDateString()); alert('Workout saved');}
function loadAll(){document.querySelectorAll('input[data-k]').forEach(i=>{let v=localStorage.getItem(i.dataset.k);if(v!==null)i.value=v}); plan[current][2].forEach((x,ei)=>{let vals=[];for(let s=0;s<x[1];s++){let w=localStorage.getItem(`${key(current,ei,s)}-w`),r=localStorage.getItem(`${key(current,ei,s)}-r`);if(w||r)vals.push(`${w||'—'} × ${r||'—'}`)}if(vals.length)document.getElementById(`last-${ei}`).textContent='Saved: '+vals.join(' • ')})}
let ti;function timer(sec){clearInterval(ti);let left=sec;let c=$('#clock');c.textContent=left+'s';ti=setInterval(()=>{left--;c.textContent=left>0?left+'s':'GO';if(left<=0){clearInterval(ti);if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}
render(); if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script></body></html>
