const guides={
'Flat DB Bench Press':['Lie flat with feet planted and shoulder blades pulled back.','Lower the dumbbells under control to chest level, then press up.','Keep wrists stacked over elbows.','Avoid bouncing, flaring elbows straight out, or lifting your hips.'],
'Flat DB Press':['Same setup as your flat dumbbell bench press.','Lower to chest level with control and press up smoothly.','Keep shoulder blades back and feet planted.','Avoid bouncing or letting shoulders roll forward.'],
'Incline DB Press':['Set the bench around 30–45°.','Lower dumbbells toward the upper chest, then press up.','Keep shoulder blades back and down.','Avoid setting the bench too upright or over-arching your back.'],
'DB Chest Fly':['Use lighter dumbbells and keep a soft bend in the elbows.','Open your arms until you feel a comfortable chest stretch.','Bring the dumbbells back together by squeezing your chest.','Avoid going excessively deep or turning the movement into a press.'],
'DB Pullover':['Hold one dumbbell securely with both hands above your chest.','Lower it behind your head with a slight elbow bend.','Pull it back over your chest while keeping ribs controlled.','Avoid excessive lower-back arching.'],
'DB Overhead Triceps Extension':['Hold one dumbbell with both hands overhead.','Bend only at the elbows to lower it behind your head.','Extend your elbows to return overhead.','Avoid letting the elbows flare excessively.'],
'DB Skull Crushers':['Lie on the bench with dumbbells above your shoulders.','Keep upper arms mostly still as you bend your elbows.','Lower beside your head, then straighten your arms.','Avoid using too much weight or letting elbows drift widely.'],
'Rope Triceps Pushdown':['Keep elbows tucked at your sides.','Push the rope down by straightening your elbows.','Separate the rope ends slightly at the bottom.','Avoid leaning on the cable or swinging your torso.'],
'One-Arm DB Row':['Brace one hand and knee on the bench with a flat back.','Pull the dumbbell toward your hip.','Pause briefly and lower under control.','Avoid twisting your torso or shrugging the weight up.'],
'Chest-Supported DB Row':['Set an incline bench and lie chest-down.','Row both dumbbells toward your lower ribs.','Squeeze shoulder blades together at the top.','Avoid lifting your chest off the pad or rocking.'],
'Lat Pulldown':['Grip slightly wider than shoulder width and sit tall.','Pull the bar toward your upper chest.','Drive elbows down and squeeze your back.','Avoid pulling behind your neck or swinging backward.'],
'Seated Cable Row':['Sit tall with a neutral spine.','Pull the handle toward your lower ribs/upper abdomen.','Finish by squeezing your shoulder blades.','Avoid excessive leaning or rounding your back.'],
'Alternating DB Curl':['Stand tall with elbows close to your sides.','Curl one dumbbell at a time without moving the upper arm.','Lower fully under control.','Avoid swinging your body.'],
'DB Curl':['Keep elbows at your sides and curl without swinging.','Squeeze the biceps at the top and lower slowly.','Keep wrists neutral.','Avoid using momentum.'],
'Hammer Curl':['Keep palms facing each other throughout the rep.','Curl while keeping elbows close to your sides.','Lower slowly to full extension.','Avoid swinging or moving the elbows forward.'],
'Incline DB Curl':['Sit back against an incline bench with arms hanging down.','Curl without moving your upper arms.','Use a lighter weight than regular curls.','Avoid bringing elbows forward.'],
'Cable Crunch':['Kneel with the rope beside your head.','Curl your rib cage toward your pelvis using your abs.','Pause at the bottom and return slowly.','Avoid pulling mainly with your arms or just hinging at the hips.'],
'Plank':['Keep a straight line from shoulders through hips to heels.','Brace your abs and glutes and breathe normally.','Keep elbows beneath shoulders.','Avoid sagging or raising your hips.'],
'Incline Treadmill':['Walk tall with short, natural strides.','Use about 3.0–3.5 mph and 6–10% incline as a starting point.','Adjust so the effort is sustainable.','Avoid supporting your body weight on the handrails.'],
'Plate-Loaded Hack Squat':['Set shoulders/back firmly against the pads and feet about shoulder width.','Descend under control as knees track with your toes.','Drive through your whole foot to stand.','Avoid knees collapsing inward or your hips lifting off the pad.'],
'Hack Squat':['Use the same controlled setup as your plate-loaded hack squat.','Descend comfortably, knees tracking over toes.','Drive through your whole foot.','Avoid bouncing out of the bottom.'],
'Plate-Loaded Leg Press':['Place feet about shoulder width on the platform.','Lower the sled until you reach a comfortable depth.','Press through the whole foot without locking knees hard.','Avoid letting your lower back/hips roll off the pad.'],
'Leg Curl Machine':['Align your knee with the machine pivot.','Curl the pad by bending your knees and squeeze your hamstrings.','Return slowly to the start.','Avoid lifting your hips or using momentum.'],
'Leg Curl':['Align your knees with the machine pivot and curl smoothly.','Squeeze hamstrings, then return under control.','Keep hips against the pad.','Avoid jerking the weight.'],
'Leg Extension Machine':['Align knees with the machine pivot and pad above the ankles.','Extend your knees smoothly and squeeze your quads.','Lower under control.','Avoid kicking or slamming the stack.'],
'Leg Extension':['Extend smoothly, squeeze quads, and lower under control.','Keep your back and hips against the pad.','Use a comfortable range of motion.','Avoid swinging the weight.'],
'Hip Abductor Machine':['Sit firmly against the back pad.','Press your knees outward under control.','Pause briefly, then return slowly.','Avoid bouncing the weight.'],
'Hip Abductor':['Press knees outward smoothly, pause, and return slowly.','Keep your torso controlled against the pad.','Use a comfortable range.','Avoid bouncing.'],
'Hip Adductor Machine':['Start in a comfortable open position.','Bring your legs together under control.','Pause briefly, then return slowly.','Avoid forcing an excessive stretch.'],
'Leg-Press Calf Raises':['Keep the balls of your feet on the platform with heels free.','Lower heels for a controlled stretch, then rise onto your toes.','Keep knees softly unlocked.','Avoid bouncing through the reps.'],
'Calf Raises':['Lower heels under control, then rise fully onto your toes.','Pause briefly at the top.','Keep the movement smooth.','Avoid bouncing.'],
'Seated DB Shoulder Press':['Sit tall with dumbbells near shoulder height.','Press overhead while keeping ribs controlled.','Lower until elbows are around shoulder level.','Avoid excessive back arching.'],
'DB Shoulder Press':['Press dumbbells overhead from shoulder height.','Keep your core braced and ribs controlled.','Lower smoothly.','Avoid excessive back arching.'],
'DB Lateral Raise':['Hold light dumbbells at your sides with soft elbows.','Raise arms out to roughly shoulder height.','Lead with the elbows and lower slowly.','Avoid shrugging or swinging.'],
'Chest-Supported DB Reverse Fly':['Lie chest-down on an incline bench.','Open your arms out and slightly back with soft elbows.','Squeeze the rear shoulders/upper back.','Avoid shrugging or using momentum.'],
'DB Reverse Fly':['Hinge or use chest support and keep a neutral spine.','Open the dumbbells out to the sides with soft elbows.','Squeeze rear shoulders and upper back.','Avoid swinging.'],
'Cable Woodchop':['Stand sideways to the cable with both hands on the handle.','Rotate through your torso/hips while keeping control.','Return slowly and repeat both sides.','Avoid yanking with only your arms.'],
'Pallof Press':['Stand sideways to the cable and hold the handle at your chest.','Press straight out and resist being rotated.','Pause, then return to your chest.','Avoid letting your torso twist toward the cable.'],
'Optional Stairs':['Stay tall and use a steady pace you can sustain.','Step with the whole foot when possible.','Use the rails only lightly for balance.','Avoid hanging your body weight on the rails.'],
'Mobility / Stretching':['Move gently through hips, hamstrings, chest and shoulders.','Hold easy stretches without forcing them.','Breathe normally and use this as recovery.','Avoid painful ranges or aggressive bouncing.']
};

82" y2="54"/><line x1="82" y1="54" x2="58" y2="42"/><line x1="120" y1="64" x2="88" y2="70"/><line x1="120" y1="98" x2="100" y2="132"/><line x1="120" y1="98" x2="140" y2="132"/><path d="M175 52 Q195 72 176 92" fill="none"/>`,fly:`<circle cx="120" cy="38" r="14"/><line x1="120" y1="52" x2="120" y2="98"/><line x1="120" y1="64" x2="62" y2="64"/><line x1="120" y1="64" x2="178" y2="64"/><circle cx="54" cy="64" r="8"/><circle cx="186" cy="64" r="8"/><line x1="120" y1="98" x2="100" y2="132"/><line x1="120" y1="98" x2="140" y2="132"/>`,legs:`<circle cx="120" cy="34" r="14"/><line x1="120" y1="48" x2="120" y2="90"/><line x1="120" y1="90" x2="92" y2="112"/><line x1="92" y1="112" x2="70" y2="130"/><line x1="120" y1="90" x2="150" y2="110"/><line x1="150" y1="110" x2="176" y2="104"/><line x1="120" y1="62" x2="92" y2="76"/><line x1="120" y1="62" x2="148" y2="76"/>`};
 return `<svg viewBox="0 0 240 150" aria-label="${name} exercise illustration"><g stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">${poses[pose]}</g><text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">${name}</text></svg>`;
}
function toggleHow(id){document.getElementById(id).classList.toggle('open')}

let current=0; const $=s=>document.querySelector(s); const key=(d,e,s)=>`gym-${d}-${e}-${s}`;
function renderDays(){ $('#days').innerHTML=plan.map((d,i)=>`<button class='day ${i===current?'active':''}' onclick='current=${i};render()'>${d[0]}</button>`).join('') }
function render(){renderDays();let [day,title,ex]=plan[current]; $('#main').innerHTML=`<h2>${day}: ${title}</h2><div class='tip'>Heavy compound lifts: rest 2–3 min. Smaller exercises: 60–90 sec. When you reach the top of the rep range on every set with good form, increase weight next time.</div>`+ex.map((x,ei)=>card(x,ei)).join('')+`<button class='save' onclick='saveAll()'>Save workout</button><div class='timer'><b>Rest timer:</b><button onclick='timer(60)'>60s</button><button onclick='timer(90)'>90s</button><button onclick='timer(180)'>3m</button><span id='clock'></span></div>`; loadAll() }
function card(x,ei){let [name,sets,target]=x;let rows='';for(let s=0;s<sets;s++)rows+=`<div class='set'><span>${s+1}</span><input inputmode='decimal' placeholder='Weight' data-k='${key(current,ei,s)}-w'><input inputmode='numeric' placeholder='Reps' data-k='${key(current,ei,s)}-r'><button onclick='this.classList.toggle("done")'>✓</button></div>`;let g=guides[name]||['Use controlled form through a comfortable range of motion.','Keep your core braced and move smoothly.','Stop if the movement causes pain.','Avoid rushing or using momentum.'];let hid=`how-${current}-${ei}`;return `<section class='card'><h3>${name}</h3><div class='meta'><span>${sets} set${sets>1?'s':''}</span><span>Target: ${target}</span></div><button class='howbtn' onclick='toggleHow("${hid}")'>📖 How to do it</button><div class='how' id='${hid}'>${photos[name]?`<div class='demo photo'><img src='${photos[name]}' alt='${name} start and finish demonstration'></div><div class='visualnote'>Visual reference • use the written cues below for form.</div>`:`<div class='demo'>${demoSvg(name)}</div>`}<ul><li>${g[0]}</li><li>${g[1]}</li><li>${g[2]}</li></ul><div class='avoid'><b>Avoid:</b> ${g[3]}</div></div><div class='sets'>${rows}</div><div class='last' id='last-${ei}'></div></section>`}
function saveAll(){document.querySelectorAll('input[data-k]').forEach(i=>localStorage.setItem(i.dataset.k,i.value)); localStorage.setItem(`gym-last-${current}`,new Date().toLocaleDateString()); alert('Workout saved');}
function loadAll(){document.querySelectorAll('input[data-k]').forEach(i=>{let v=localStorage.getItem(i.dataset.k);if(v!==null)i.value=v}); plan[current][2].forEach((x,ei)=>{let vals=[];for(let s=0;s<x[1];s++){let w=localStorage.getItem(`${key(current,ei,s)}-w`),r=localStorage.getItem(`${key(current,ei,s)}-r`);if(w||r)vals.push(`${w||'—'} × ${r||'—'}`)}if(vals.length)document.getElementById(`last-${ei}`).textContent='Saved: '+vals.join(' • ')})}
let ti;function timer(sec){clearInterval(ti);let left=sec;let c=$('#clock');c.textContent=left+'s';ti=setInterval(()=>{left--;c.textContent=left>0?left+'s':'GO';if(left<=0){clearInterval(ti);if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}
render();
</script></body></html>
