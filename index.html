<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><title>My Gym Plan</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f17;color:#f8fafc;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{position:sticky;top:0;background:#0b0f17ee;backdrop-filter:blur(12px);padding:12px 0 10px;z-index:2}h1{font-size:25px;margin:0}small,.muted{color:#94a3b8}.days{display:flex;gap:8px;overflow:auto;padding:10px 0}.day{border:0;border-radius:12px;padding:10px 13px;background:#1e293b;color:#fff;white-space:nowrap;font-weight:700}.day.active{background:#fff;color:#111827}.day.complete{box-shadow:inset 0 0 0 2px #22c55e}.daycheck{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:7px;border-radius:6px;border:2px solid #64748b;background:#0f172a;color:transparent;font-weight:900;vertical-align:middle}.daycheck.checked{background:#22c55e;border-color:#22c55e;color:#052e16}.day.active .daycheck{border-color:#64748b}.daycomplete{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#151c29;border:1px solid #273244;border-radius:14px;padding:12px 14px;margin:10px 0 14px}.daycomplete button{border:2px solid #64748b;background:#0f172a;color:transparent;border-radius:8px;width:34px;height:34px;font-size:20px;font-weight:900}.daycomplete button.checked{background:#22c55e;border-color:#22c55e;color:#052e16}.card{background:#151c29;border:1px solid #273244;border-radius:16px;padding:14px;margin:10px 0}.card h3{margin:0 0 4px;font-size:17px}.howbtn{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:10px;padding:8px 10px;font-weight:700;margin:2px 0 10px}.how{display:none;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;margin:0 0 12px}.how.open{display:block}.demo{height:150px;border-radius:10px;background:linear-gradient(145deg,#172033,#0b1220);display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}.demo svg{width:100%;height:100%}.demo.photo{height:auto;display:block;background:#08111f}.demo.photo img{display:block;width:100%;height:auto;border-radius:10px}.visualgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.visualgrid figure{margin:0;position:relative;background:#08111f;border:1px solid #334155;border-radius:12px;overflow:hidden}.visualgrid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.poseLabel{position:absolute;left:7px;bottom:7px;background:#2563eb;color:white;font-weight:800;font-size:11px;padding:5px 7px;border-radius:7px;z-index:1}.muscles{background:#172554;border:1px solid #3b82f6;border-radius:10px;padding:9px 10px;margin:0 0 9px;color:#dbeafe;font-size:13px}.source{color:#64748b;font-size:10px;text-align:center;margin:20px 0 8px}.visualnote{font-size:11px;color:#94a3b8;margin:-4px 0 10px}.how ul{margin:7px 0 0;padding-left:20px;color:#cbd5e1;line-height:1.45}.avoid{color:#fca5a5;margin-top:8px;font-size:13px}.meta{display:flex;gap:10px;color:#cbd5e1;font-size:13px;margin-bottom:10px}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:7px;align-items:center}.set span{font-weight:700;text-align:center}.set input{width:100%;border:1px solid #334155;background:#0f172a;color:#fff;border-radius:9px;padding:10px;font-size:16px}.set button{height:40px;border:0;border-radius:10px;background:#334155;color:#fff;font-size:18px}.set button.done{background:#22c55e;color:#052e16}.last{font-size:12px;color:#94a3b8;margin-top:8px}.timer{display:flex;gap:8px;align-items:center;margin:12px 0}.timer button,.save{border:0;border-radius:11px;padding:11px 13px;font-weight:700}.timer button{background:#1e293b;color:#fff}.save{background:#f8fafc;color:#0f172a;width:100%;font-size:16px}.recovery{font-size:18px;line-height:1.5}.tip{background:#172033;border-radius:12px;padding:10px;font-size:13px;color:#cbd5e1;margin:8px 0 14px}footer{text-align:center;color:#64748b;font-size:12px;padding:24px 0}</style></head><body><header><h1>My Gym Plan</h1><small>5 lifting days • 2 active recovery days</small><div class='days' id='days'></div></header><main id='main'></main><footer>Progress is saved on this device.</footer><div class='source'>Exercise start/finish images: Free Exercise DB (public domain).</div><script>
const plan=[
['Day 1','Chest + Triceps',[['Flat DB Bench Press',4,'6–8'],['Incline DB Press',4,'8–10'],['DB Chest Fly',3,'10–12'],['Dumbbell Squeeze Press',3,'8–12'],['DB Pullover',3,'10–12'],['DB Overhead Triceps Extension',3,'8–12'],['DB Skull Crushers',3,'10–12'],['Dips',3,'6–12'],['Rope Triceps Pushdown',3,'10–15']]],
['Day 2','Back + Biceps',[['One-Arm DB Row',4,'6–8 / arm'],['Chest-Supported DB Row',3,'8–10'],['Lat Pulldown',4,'8–10'],['Seated Cable Row',3,'8–12'],['Cross-Body Dumbbell Curl',3,'8–10'],['Hammer Curl',3,'10–12'],['Incline DB Curl',2,'10–12']]],
['Day 3','Active Recovery',[]],
['Day 4','Heavy Legs + Shoulders',[['Plate-Loaded Hack Squat',4,'6–8'],['Plate-Loaded Leg Press',4,'8–10'],['Leg-Press Calf Raises',4,'12–15'],['Leg Curl Machine',4,'8–12'],['Leg Extension Machine',3,'10–15'],['Hip Abductor Machine',3,'12–15'],['Hip Adductor Machine',3,'12–15'],['Seated DB Shoulder Press',4,'6–8'],['DB Lateral Raise',3,'10–15'],['Chest-Supported DB Reverse Fly',3,'12–15']]],
['Day 5','Chest + Back + Arms',[['Incline DB Press',3,'8–10'],['Flat DB Press',3,'10–12'],['Chest-Supported DB Row',3,'8–10'],['Lat Pulldown',3,'8–12'],['Cross-Body Dumbbell Curl',3,'8–12'],['Hammer Curl',2,'10–12'],['Incline DB Curl',2,'10–12'],['DB Overhead Triceps Extension',3,'8–12'],['Rope Triceps Pushdown',2,'10–15'],['DB Lateral Raise',3,'12–15'],['Dips',3,'6–12']]],
['Day 6','Legs + Shoulders + Golf Core',[['Plate-Loaded Leg Press',4,'10–12'],['Hack Squat',3,'10–12'],['Calf Raises',4,'12–15'],['Leg Curl',4,'10–12'],['Leg Extension',3,'12–15'],['Hip Abductor',3,'12–15'],['DB Shoulder Press',3,'8–10'],['DB Lateral Raise',3,'12–15'],['DB Reverse Fly',3,'12–15'],['Cable Woodchop',3,'10–12 / side'],['Pallof Press',3,'10–12 / side']]],
['Day 7','Active Recovery',[]]];

const guides={
'Flat DB Bench Press':['Lie flat with feet planted and shoulder blades pulled back.','Lower the dumbbells under control to chest level, then press up.','Keep wrists stacked over elbows.','Avoid bouncing, flaring elbows straight out, or lifting your hips.'],
'Flat DB Press':['Same setup as your flat dumbbell bench press.','Lower to chest level with control and press up smoothly.','Keep shoulder blades back and feet planted.','Avoid bouncing or letting shoulders roll forward.'],
'Incline DB Press':['Set the bench around 30–45°.','Lower dumbbells toward the upper chest, then press up.','Keep shoulder blades back and down.','Avoid setting the bench too upright or over-arching your back.'],
'DB Chest Fly':['Use lighter dumbbells and keep a soft bend in the elbows.','Open your arms until you feel a comfortable chest stretch.','Bring the dumbbells back together by squeezing your chest.','Avoid going excessively deep or turning the movement into a press.'],
'DB Pullover':['Hold one dumbbell securely with both hands above your chest.','Lower it behind your head with a slight elbow bend.','Pull it back over your chest while keeping ribs controlled.','Avoid excessive lower-back arching.'],
'DB Overhead Triceps Extension':['Hold one dumbbell with both hands overhead.','Bend only at the elbows to lower it behind your head.','Extend your elbows to return overhead.','Avoid letting the elbows flare excessively.'],
'DB Skull Crushers':['Lie on the bench with dumbbells above your shoulders.','Keep upper arms mostly still as you bend your elbows.','Lower beside your head, then straighten your arms.','Avoid using too much weight or letting elbows drift widely.'],
'Dumbbell Squeeze Press':['Lie flat with a dumbbell in each hand and press the dumbbells firmly together over your chest.','Keep squeezing the dumbbells together as you lower them toward the center of your chest.','Press back up while maintaining inward pressure throughout the rep.','Avoid letting the dumbbells separate, flaring your elbows too far, or bouncing off your chest.'],
'Rope Triceps Pushdown':['Keep elbows tucked at your sides.','Push the rope down by straightening your elbows.','Separate the rope ends slightly at the bottom.','Avoid leaning on the cable or swinging your torso.'],
'Dips':['Start at the top on parallel bars with arms nearly straight and shoulders down.','Lower under control until your upper arms are about parallel with the floor or as deep as comfortable.','Press back to the top through your chest and triceps.','Avoid dropping too deep, shrugging your shoulders, or bouncing out of the bottom.'],
'One-Arm DB Row':['Brace one hand and knee on the bench with a flat back.','Pull the dumbbell toward your hip.','Pause briefly and lower under control.','Avoid twisting your torso or shrugging the weight up.'],
'Chest-Supported DB Row':['Set an incline bench and lie chest-down.','Row both dumbbells toward your lower ribs.','Squeeze shoulder blades together at the top.','Avoid lifting your chest off the pad or rocking.'],
'Lat Pulldown':['Grip slightly wider than shoulder width and sit tall.','Pull the bar toward your upper chest.','Drive elbows down and squeeze your back.','Avoid pulling behind your neck or swinging backward.'],
'Seated Cable Row':['Sit tall with a neutral spine.','Pull the handle toward your lower ribs/upper abdomen.','Finish by squeezing your shoulder blades.','Avoid excessive leaning or rounding your back.'],
'Alternating DB Curl':['Stand tall with elbows close to your sides.','Curl one dumbbell at a time without moving the upper arm.','Lower fully under control.','Avoid swinging your body.'],
'Cross-Body Dumbbell Curl':['Stand tall with a dumbbell in each hand and palms facing your body.','Curl one dumbbell diagonally across your torso toward the opposite shoulder.','Keep your upper arm close to your side and lower the dumbbell slowly under control.','Avoid swinging your body or letting your elbow drift forward.'],
'Hammer Curl':['Keep palms facing each other throughout the rep.','Curl while keeping elbows close to your sides.','Lower slowly to full extension.','Avoid swinging or moving the elbows forward.'],
'Incline DB Curl':['Sit back against an incline bench with arms hanging down.','Curl without moving your upper arms.','Use a lighter weight than regular curls.','Avoid bringing elbows forward.'],
'Plate-Loaded Hack Squat':['Set shoulders/back firmly against the pads and feet about shoulder width.','Descend under control as knees track with your toes.','Drive through your whole foot to stand.','Avoid knees collapsing inward or your hips lifting off the pad.'],
'Hack Squat':['Use the same controlled setup as your plate-loaded hack squat.','Descend comfortably, knees tracking over toes.','Drive through your whole foot.','Avoid bouncing out of the bottom.'],
'Plate-Loaded Leg Press':['Place feet about shoulder width on the platform.','Lower the sled until you reach a comfortable depth.','Press through the whole foot without locking knees hard.','Avoid letting your lower back/hips roll off the pad.'],
'Leg Curl Machine':['Align your knee with the machine pivot.','Curl the pad by bending your knees and squeeze your hamstrings.','Return slowly to the start.','Avoid lifting your hips or using momentum.'],
'Leg Curl':['Align your knees with the machine pivot and curl smoothly.','Squeeze hamstrings, then return under control.','Keep hips against the pad.','Avoid jerking the weight.'],
'Leg Extension Machine':['Align knees with the machine pivot and pad above the ankles.','Extend your knees smoothly and squeeze your quads.','Lower under control.','Avoid kicking or slamming the stack.'],
'Leg Extension':['Extend smoothly, squeeze quads, and lower under control.','Keep your back and hips against the pad.','Use a comfortable range of motion.','Avoid swinging the weight.'],
'Hip Abductor Machine':['Sit firmly against the back pad.','Press your knees outward under control.','Pause briefly, then return slowly.','Avoid bouncing the weight.'],
'Hip Abductor':['Press knees outward smoothly, pause, and return slowly.','Keep your torso controlled against the pad.','Use a comfortable range.','Avoid bouncing.'],
'Hip Adductor Machine':['Start in a comfortable open position.','Bring your legs together under control.','Pause briefly, then return slowly.','Avoid forcing an excessive stretch.'],
'Leg-Press Calf Raises':['Keep the balls of your feet on the platform with heels free.','Lower heels for a controlled stretch, then rise onto your toes.','Keep knees softly unlocked.','Avoid bouncing through the reps.'],
'Calf Raises':['Lower heels under control, then rise fully onto your toes.','Pause briefly at the top.','Keep the movement smooth.','Avoid bouncing.'],
'Seated DB Shoulder Press':['Sit tall with dumbbells near shoulder height.','Press overhead while keeping ribs controlled.','Lower until elbows are around shoulder level.','Avoid excessive back arching.'],
'DB Shoulder Press':['Press dumbbells overhead from shoulder height.','Keep your core braced and ribs controlled.','Lower smoothly.','Avoid excessive back arching.'],
'DB Lateral Raise':['Hold light dumbbells at your sides with soft elbows.','Raise arms out to roughly shoulder height.','Lead with the elbows and lower slowly.','Avoid shrugging or swinging.'],
'Chest-Supported DB Reverse Fly':['Lie chest-down on an incline bench.','Open your arms out and slightly back with soft elbows.','Squeeze the rear shoulders/upper back.','Avoid shrugging or using momentum.'],
'DB Reverse Fly':['Hinge or use chest support and keep a neutral spine.','Open the dumbbells out to the sides with soft elbows.','Squeeze rear shoulders and upper back.','Avoid swinging.'],
};
const visualData={"Flat DB Bench Press":{"id":"Dumbbell_Bench_Press","muscles":"Chest \u2022 shoulders \u2022 triceps"},"Incline DB Press":{"id":"Incline_Dumbbell_Press","muscles":"Upper chest \u2022 shoulders \u2022 triceps"},"DB Chest Fly":{"id":"Dumbbell_Flyes","muscles":"Chest \u2022 front shoulders"},"DB Pullover":{"id":"Bent-Arm_Dumbbell_Pullover","muscles":"Chest \u2022 lats \u2022 triceps"},"DB Overhead Triceps Extension":{"id":"Seated_Triceps_Press","muscles":"Triceps"},"DB Skull Crushers":{"id":"Lying_Triceps_Press","muscles":"Triceps"},"Dumbbell Squeeze Press":{"id":"Dumbbell_Bench_Press","muscles":"Chest • triceps • front shoulders"},"Rope Triceps Pushdown":{"id":"Triceps_Pushdown_-_Rope_Attachment","muscles":"Triceps"},"Dips":{"id":"Dips_-_Chest_Version","muscles":"Chest • triceps • shoulders"},"One-Arm DB Row":{"id":"One-Arm_Dumbbell_Row","muscles":"Middle back \u2022 lats \u2022 biceps"},"Chest-Supported DB Row":{"id":"Dumbbell_Incline_Row","muscles":"Middle back \u2022 lats \u2022 biceps"},"Lat Pulldown":{"id":"Wide-Grip_Lat_Pulldown","muscles":"Lats \u2022 biceps \u2022 middle back"},"Seated Cable Row":{"id":"Seated_Cable_Rows","muscles":"Middle back \u2022 lats \u2022 biceps"},"Alternating DB Curl":{"id":"Dumbbell_Alternate_Bicep_Curl","muscles":"Biceps \u2022 forearms"},"Hammer Curl":{"id":"Alternate_Hammer_Curl","muscles":"Biceps \u2022 forearms"},"Incline DB Curl":{"id":"Incline_Dumbbell_Curl","muscles":"Biceps \u2022 forearms"},"Cable Woodchop":{"id":"Standing_Cable_Wood_Chop","muscles":"Abdominals \u2022 obliques \u2022 shoulders"},"Pallof Press":{"id":"Pallof_Press","muscles":"Abdominals \u2022 obliques \u2022 shoulders"},"Plate-Loaded Hack Squat":{"id":"Hack_Squat","muscles":"Quadriceps \u2022 glutes \u2022 hamstrings \u2022 calves"},"Plate-Loaded Leg Press":{"id":"Leg_Press","muscles":"Quadriceps \u2022 glutes \u2022 hamstrings \u2022 calves"},"Leg Curl Machine":{"id":"Lying_Leg_Curls","muscles":"Hamstrings"},"Leg Extension Machine":{"id":"Leg_Extensions","muscles":"Quadriceps"},"Hip Abductor Machine":{"id":"Thigh_Abductor","muscles":"Hip abductors \u2022 glutes"},"Hip Adductor Machine":{"id":"Thigh_Adductor","muscles":"Inner thighs / adductors"},"Leg-Press Calf Raises":{"id":"Calf_Press_On_The_Leg_Press_Machine","muscles":"Calves"},"Seated DB Shoulder Press":{"id":"Seated_Dumbbell_Press","muscles":"Shoulders \u2022 triceps"},"DB Lateral Raise":{"id":"Side_Lateral_Raise","muscles":"Side deltoids / shoulders"},"Chest-Supported DB Reverse Fly":{"id":"Reverse_Flyes","muscles":"Rear deltoids \u2022 upper back"},"Flat DB Press":{"id":"Dumbbell_Bench_Press","muscles":"Chest \u2022 shoulders \u2022 triceps"},"Cross-Body Dumbbell Curl":{"id":"Cross_Body_Hammer_Curl","muscles":"Biceps \u2022 brachialis \u2022 forearms"},"Hack Squat":{"id":"Hack_Squat","muscles":"Quadriceps \u2022 glutes \u2022 hamstrings \u2022 calves"},"Leg Curl":{"id":"Lying_Leg_Curls","muscles":"Hamstrings"},"Leg Extension":{"id":"Leg_Extensions","muscles":"Quadriceps"},"Hip Abductor":{"id":"Thigh_Abductor","muscles":"Hip abductors \u2022 glutes"},"Calf Raises":{"id":"Calf_Press_On_The_Leg_Press_Machine","muscles":"Calves"},"DB Shoulder Press":{"id":"Seated_Dumbbell_Press","muscles":"Shoulders \u2022 triceps"},"DB Reverse Fly":{"id":"Reverse_Flyes","muscles":"Rear deltoids \u2022 upper back"}};
const imgBase="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
function visualPanel(name){
 const v=visualData[name];
 if(!v)return '';
 const src0=imgBase+v.id+'/0.jpg', src1=imgBase+v.id+'/1.jpg';
 return `<div class="muscles"><b>🎯 Targets:</b> ${v.muscles}</div>
 <div class="visualgrid">
  <figure><div class="poseLabel">START</div><img src="${src0}" alt="${name} starting position"></figure>
  <figure><div class="poseLabel">FINISH</div><img src="${src1}" alt="${name} finishing position"></figure>
 </div>
 <div class="visualnote">Start and finish reference • use the written cues below for form.</div>`; 
}
function toggleHow(id){document.getElementById(id).classList.toggle('open')}

let current=parseInt(localStorage.getItem('gym-current-day')||'0',10); if(!Number.isInteger(current)||current<0||current>=plan.length)current=0; const $=s=>document.querySelector(s); const key=(d,e,s)=>`gym-${d}-${e}-${s}`;
function dayDone(i){return localStorage.getItem(`gym-day-${i}-done`)==='1'}
function selectDay(i){current=i;localStorage.setItem('gym-current-day',current);render()}
function toggleDayDone(i,e){if(e)e.stopPropagation();localStorage.setItem(`gym-day-${i}-done`,dayDone(i)?'0':'1');render()}
function renderDays(){ $('#days').innerHTML=plan.map((d,i)=>`<button class='day ${i===current?'active':''} ${dayDone(i)?'complete':''}' onclick='selectDay(${i})'>${d[0]}<span class='daycheck ${dayDone(i)?'checked':''}' onclick='toggleDayDone(${i},event)'>✓</span></button>`).join('') }
function render(){renderDays();let [day,title,ex]=plan[current];let empty=ex.length===0?`<div class='card recovery'>Do your own active recovery today, then check the day complete when you're finished.</div>`:''; $('#main').innerHTML=`<h2>${day}: ${title}</h2><div class='daycomplete'><b>Day complete</b><button class='${dayDone(current)?'checked':''}' onclick='toggleDayDone(current,event)'>✓</button></div>`+(ex.length?`<div class='tip'>Heavy compound lifts: rest 2–3 min. Smaller exercises: 60–90 sec. When you reach the top of the rep range on every set with good form, increase weight next time.</div>`:'')+empty+ex.map((x,ei)=>card(x,ei)).join('')+(ex.length?`<button class='save' onclick='saveAll()'>Save workout</button><div class='timer'><b>Rest timer:</b><button onclick='timer(60)'>60s</button><button onclick='timer(90)'>90s</button><button onclick='timer(180)'>3m</button><span id='clock'></span></div>`:''); loadAll() }
function card(x,ei){let [name,sets,target]=x;let rows='';for(let s=0;s<sets;s++)rows+=`<div class='set'><span>${s+1}</span><input inputmode='decimal' placeholder='Weight' data-k='${key(current,ei,s)}-w'><input inputmode='numeric' placeholder='Reps' data-k='${key(current,ei,s)}-r'><button data-k='${key(current,ei,s)}-done' onclick='toggleDone(this)'>✓</button></div>`;let g=guides[name]||['Use controlled form through a comfortable range of motion.','Keep your core braced and move smoothly.','Stop if the movement causes pain.','Avoid rushing or using momentum.'];let hid=`how-${current}-${ei}`;return `<section class='card'><h3>${name}</h3><div class='meta'><span>${sets} set${sets>1?'s':''}</span><span>Target: ${target}</span></div><button class='howbtn' onclick='toggleHow("${hid}")'>📖 How to do it</button><div class='how' id='${hid}'>${visualPanel(name)}<ul><li>${g[0]}</li><li>${g[1]}</li><li>${g[2]}</li></ul><div class='avoid'><b>Avoid:</b> ${g[3]}</div></div><div class='sets'>${rows}</div><div class='last' id='last-${ei}'></div></section>`}
function toggleDone(btn){btn.classList.toggle('done');localStorage.setItem(btn.dataset.k,btn.classList.contains('done')?'1':'0');document.querySelectorAll('input[data-k]').forEach(i=>localStorage.setItem(i.dataset.k,i.value));localStorage.setItem(`gym-last-${current}`,new Date().toLocaleDateString());}
function saveAll(){document.querySelectorAll('input[data-k]').forEach(i=>localStorage.setItem(i.dataset.k,i.value)); localStorage.setItem(`gym-last-${current}`,new Date().toLocaleDateString()); alert('Workout saved');}
function loadAll(){document.querySelectorAll('input[data-k]').forEach(i=>{let v=localStorage.getItem(i.dataset.k);if(v!==null)i.value=v});document.querySelectorAll('button[data-k$="-done"]').forEach(b=>{if(localStorage.getItem(b.dataset.k)==='1')b.classList.add('done')}); plan[current][2].forEach((x,ei)=>{let vals=[];for(let s=0;s<x[1];s++){let w=localStorage.getItem(`${key(current,ei,s)}-w`),r=localStorage.getItem(`${key(current,ei,s)}-r`);if(w||r)vals.push(`${w||'—'} × ${r||'—'}`)}if(vals.length)document.getElementById(`last-${ei}`).textContent='Saved: '+vals.join(' • ')})}
let ti;function timer(sec){clearInterval(ti);let left=sec;let c=$('#clock');c.textContent=left+'s';ti=setInterval(()=>{left--;c.textContent=left>0?left+'s':'GO';if(left<=0){clearInterval(ti);if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}
render();
</script></body></html>
